const CONFIG_GROUPS=[{"id": "agents", "name": "Agents", "owner": "Agent definitions của harness", "effect": "Lưu definition và bindings cho lượt mới; phiên/work cũ giữ snapshot đã resolve.", "fields": [["Harness Engineering Orchestrator", "planning", "definition"], ["Project Orchestrator", "development", "definition"], ["Worker mặc định", "implementation", "definition"], ["Reviewer", "review", "definition"]], "advanced": "Chọn profile native chính/fallback, skills và principles tại đây. Tạo/sửa provider/model/thinking/mode trong Paseo trước."}, {"id": "limits", "name": "Limits", "owner": "Runtime admission", "effect": "Trần mới áp cho admission mới; không hứa thu hồi chi phí hay thay contract work hiện tại.", "fields": [["Worker đồng thời toàn bộ kit", "2", "number"], ["Phút tối đa mỗi work", "30", "number"]], "advanced": "Retry/backoff và quality rounds có trần mặc định trong program. Budget USD chưa có adapter enforce trong fixture nên không nhập số giả."}, {"id": "actions", "name": "Actions", "owner": "Authority của người vận hành", "effect": "Kiểm lại quyền trước hành động; candidate không được tự thay quyền hoặc giới hạn.", "fields": [["Push", "ask", "action"], ["Tạo PR", "ask", "action"], ["Merge", "ask", "action"], ["Publish", "ask", "action"], ["Kích hoạt cải tiến đã kiểm", "allow", "action"]], "advanced": "allow / ask / deny chỉ trong quyền provider/host thật. Quyền native không tự cấp quyền nghiệp vụ; catalog không thể nới authority."}, {"id": "automations", "name": "Automations", "owner": "Code jobs / native references", "effect": "Code-job cadence thuộc harness; agent schedule/heartbeat thuộc Paseo.", "fields": [], "advanced": "Chỉnh jobs tại Jobs & triggers. Cursor, last run và trạng thái chỉ đọc. Không lưu một bản cadence khác trong settings."}];
// BEGIN PROTOTYPE MODEL
// Pure local fixture model. No provider, storage, scheduling or production guarantees.
function createPrototypeModel(state, nextId) {
  const copy=value=>JSON.parse(JSON.stringify(value));
  const terminal=status=>['completed','failed','cancelled'].includes(status);
  const requireItem=id=>{const item=state.workItems.find(x=>x.id===id);if(!item)throw new Error('WORK_ITEM_NOT_FOUND');return item;};
  const requireRun=id=>{const run=state.workflowRuns.find(x=>x.id===id);if(!run)throw new Error('RUN_NOT_FOUND');return run;};
  const requireSession=id=>{const session=state.agentSessions.find(x=>x.id===id);if(!session)throw new Error('SESSION_NOT_FOUND');return session;};
  const release=id=>state.releaseCatalog.find(x=>x.id===id)||null;
  function submit({title,owner,origin='chat',criteriaRevision='criteria-1',requestKey=''}) {
    if(requestKey){const old=state.workItems.find(x=>x.owner===owner&&x.requestKey===requestKey);if(old){if(old.title!==title)throw new Error('REQUEST_KEY_CONFLICT');return old;}}
    const item={id:nextId('request'),title,owner,origin,criteriaRevision,requestKey,status:'open',revision:1,resolution:null};
    state.workItems.unshift(item);return item;
  }
  function startRun(workItemId, input) {
    const item=requireItem(workItemId);if(item.status==='resolved')throw new Error('WORK_ITEM_ALREADY_RESOLVED');
    if(input.owner&&input.owner!==item.owner)throw new Error('RUN_OWNER_MISMATCH');
    if(input.occurrence){const old=state.workflowRuns.find(x=>x.occurrence===input.occurrence);if(old){if(old.workItemId!==item.id)throw new Error('OCCURRENCE_CONFLICT');return old;}}
    const run={...copy(input),id:nextId('run'),workItemId:item.id,owner:item.owner,outcome:null};
    state.workflowRuns.unshift(run);return run;
  }
  function assign(runId,sessionId,bundle) {
    const run=requireRun(runId),session=requireSession(sessionId);
    if(terminal(run.status))throw new Error('RUN_TERMINAL');
    if(session.status==='handed-over'||session.owner!==run.owner)throw new Error('SESSION_NOT_ELIGIBLE');
    if(state.assignments.some(a=>a.sessionId===sessionId&&!terminal(a.status)))throw new Error('SESSION_BUSY');
    const assignment={id:nextId('assignment'),runId,sessionId,owner:run.owner,role:bundle?.role||'worker',status:run.status,bundle:bundle?copy(bundle):null,configRevision:run.configRevision,criteriaRevision:run.criteriaRevision,outcome:null};
    state.assignments.unshift(assignment);session.status='busy';return assignment;
  }
  function syncRun(runId) {
    const run=requireRun(runId);
    if(terminal(run.status)&&!run.outcome)run.outcome={status:run.status,evidenceIds:[...run.evidence],remainingIssues:run.status==='completed'?[]:[run.reason||run.status]};
    for(const a of state.assignments.filter(x=>x.runId===runId)){
      if(!terminal(a.status))a.status=run.status;if(terminal(run.status)&&!a.outcome)a.outcome={...copy(run.outcome),source:'fixture-run-propagation'};
      const session=requireSession(a.sessionId);
      if(session.status!=='handed-over')session.status=state.assignments.some(x=>x.sessionId===session.id&&!terminal(x.status))?'busy':'idle';
    }
  }
  function recordAssignmentOutcome(assignmentId,outcome) {
    const a=state.assignments.find(x=>x.id===assignmentId);if(!a)throw new Error('ASSIGNMENT_NOT_FOUND');
    if(a.outcome)throw new Error('ASSIGNMENT_ALREADY_FINISHED');
    if(!terminal(outcome.status))throw new Error('ASSIGNMENT_TERMINAL_OUTCOME_REQUIRED');
    a.outcome=copy(outcome);a.status=outcome.status;
    const session=requireSession(a.sessionId);if(session.status!=='handed-over')session.status=state.assignments.some(x=>x.sessionId===session.id&&!terminal(x.status))?'busy':'idle';
    return a;
  }
  function finishRun(runId,status,evidenceIds=[]) {
    const run=requireRun(runId);if(terminal(run.status))throw new Error('RUN_TERMINAL');
    if(!terminal(status))throw new Error('INVALID_TERMINAL_STATE');
    if(evidenceIds.some(id=>!state.evidence.some(e=>e.id===id&&e.runId===runId)))throw new Error('RUN_EVIDENCE_MISMATCH');
    if(status==='completed'&&!evidenceIds.length)throw new Error('RUN_EVIDENCE_REQUIRED');
    run.evidence=[...new Set([...run.evidence,...evidenceIds])];run.status=status;syncRun(runId);return run;
  }
  function resolve(workItemId,report) {
    const item=requireItem(workItemId);
    if(item.status==='resolved')throw new Error('WORK_ITEM_ALREADY_RESOLVED');
    if(state.workflowRuns.some(r=>r.workItemId===item.id&&!terminal(r.status)))throw new Error('REQUEST_HAS_OPEN_RUNS');
    if(report.workItemId!==item.id||report.criteriaRevision!==item.criteriaRevision||report.verdict!=='passed'||!report.evidenceIds?.length)throw new Error('REQUEST_EVALUATION_REQUIRED');
    if(report.evidenceIds.some(id=>!state.evidence.some(e=>e.id===id&&e.scope==='work-item'&&e.workItemId===item.id&&e.criteriaRevision===item.criteriaRevision)))throw new Error('REQUEST_EVIDENCE_MISMATCH');
    item.status='resolved';item.revision++;item.resolution=copy(report);return item;
  }
  function registerRelease(version) {
    let record=state.releaseCatalog.find(x=>x.version===version);
    if(!record){record={id:nextId('release'),version,boot:'unknown',verification:'unknown'};state.releaseCatalog.push(record);}return record;
  }
  function selectActivation(version){const r=registerRelease(version);state.activationTargetRef=r.id;return r;}
  function activateTarget(){const r=release(state.activationTargetRef);if(!r)throw new Error('ACTIVATION_TARGET_REQUIRED');r.boot='passed';state.activeReleaseRef=r.id;return r;}
  function bootFailed(){const target=release(state.activationTargetRef);if(target)target.boot='failed';state.activeReleaseRef=null;}
  function markVerified(){const r=release(state.activeReleaseRef);if(!r)throw new Error('NO_ACTIVE_RELEASE');r.verification='passed';state.lastVerifiedReleaseRef=r.id;}
  function selectRecovery(operationId,releaseId,{boot,compatible}) {
    if(!operationId)throw new Error('RECOVERY_OPERATION_REQUIRED');
    state.recoverySelection=null;
    const r=release(releaseId);if(!r||!boot||!compatible)throw new Error('RECOVERY_NOT_COMPATIBLE');
    state.recoverySelection={operationId,releaseId,schemaRevision:state.dataSchemaRevision,boot:'passed',compatibility:'passed'};return state.recoverySelection;
  }
  function recover(operationId,{compatible}) {
    const selected=state.recoverySelection;
    if(!selected||selected.operationId!==operationId||selected.schemaRevision!==state.dataSchemaRevision||!compatible)throw new Error('RECOVERY_SELECTION_STALE');
    const r=release(selected.releaseId);if(!r)throw new Error('RECOVERY_RELEASE_MISSING');r.boot='passed';state.activeReleaseRef=r.id;return r;
  }
  function view(workItemId){const item=requireItem(workItemId);return {item,runs:state.workflowRuns.filter(r=>r.workItemId===item.id)};}
  function assignmentsForSession(sessionId){requireSession(sessionId);return state.assignments.filter(a=>a.sessionId===sessionId);}
  return {submit,startRun,assign,syncRun,recordAssignmentOutcome,finishRun,resolve,view,assignmentsForSession,selectActivation,activateTarget,bootFailed,markVerified,selectRecovery,recover,release};
}
if(typeof module!=='undefined'&&module.exports)module.exports={createPrototypeModel};

function modelAction(action,key){
 try{
  if(!online()){render();return;}
  if(action==='submit'){const item=prototypeModel().submit({title:'Yêu cầu mới từ chat (fixture)',owner:'project',origin:'chat-fixture'});nav('work-item/'+item.id);return;}
  if(action==='run'){const item=S.workItems.find(w=>w.id===key);if(!item)return;const run=submitAndStartRun(item.title,item.owner,'task','fixture','',null,item.id);nav('run/'+run.id);return;}
  if(action==='reuse'){
   const previous=S.workflowRuns.find(r=>r.id===key),assignment=S.assignments.find(a=>a.runId===key);if(!previous||!assignment)return;
   const session=S.agentSessions.find(g=>g.id===assignment.sessionId);
   if(!session||session.status!=='idle')throw new Error('SESSION_NOT_ELIGIBLE');
   const run=submitAndStartRun(previous.title,previous.owner,previous.kind,'fixture-session-reuse','',previous.bundle,previous.workItemId,session.id);nav('run/'+run.id);return;
  }
  if(action==='resolve'){
   const {item,runs}=prototypeModel().view(key),completed=runs.filter(r=>r.status==='completed'&&r.evidence.length);
   if(!completed.length||runs.some(r=>!['completed','failed','cancelled'].includes(r.status)))throw new Error('REQUEST_EVALUATION_NOT_READY');
   const ev={id:id('evidence-request'),scope:'work-item',workItemId:item.id,criteriaRevision:item.criteriaRevision,title:'Đánh giá yêu cầu (fixture)',summary:'Kịch bản mô phỏng đánh giá tổng hợp theo tiêu chí của yêu cầu; không gọi evaluator thật.',details:'Evidence sources: '+completed.flatMap(r=>r.evidence).join(', '),ref:'fixture:request-evaluation',outcome:'passed',configRevision:S.config.revision};
   S.evidence.unshift(ev);
   prototypeModel().resolve(item.id,{workItemId:item.id,criteriaRevision:item.criteriaRevision,verdict:'passed',evidenceIds:[ev.id]});audit('request','Đã giải quyết '+item.id+' qua đánh giá riêng','work-item/'+item.id);
  }
 }catch(error){notice='Không thực hiện: '+error.message;}
 save();render();
}

function configChanges(){return Object.entries(S.config.draft).map(([key,value])=>{const [scope,path]=key.split('|');const [group,index]=path.split(':');const g=CONFIG_GROUPS.find(g=>g.id===group);return {key,scope,path,value,old:effectiveConfig(scope,path),group:g,field:g.fields[+index][0]};});}
function validateConfig(){const errs=[];if(S.config.base!==S.config.revision)errs.push('Revision conflict: nháp dựa r'+S.config.base+', active r'+S.config.revision+'. Đọc lại revision rồi xem diff.');if(S.config.capabilityMissing)errs.push('Capability fixture thiếu: không bỏ option hoặc nới quyền.');for(const c of configChanges()){if(c.scope!=='kit')errs.push('V1 chỉ có scope kit.');if(c.group.id==='agents'&&!definitionById(c.value))errs.push(c.field+': agent definition chưa có.');if(c.group.id==='limits'){const n=Number(c.value);if(!/^\d+$/.test(c.value)||n<1||!Number.isSafeInteger(n)||(c.path==='limits:0'&&n>10))errs.push(c.field+': cần số nguyên dương'+(c.path==='limits:0'?' từ 1–10 trong fixture.':'.'));}if(c.group.id==='actions'&&!['allow','ask','deny'].includes(c.value))errs.push(c.field+': cần allow / ask / deny.');}S.config.errors=errs;return errs;}
function configView(){const c=S.config,query=c.query.toLowerCase(),groups=CONFIG_GROUPS.filter(g=>(g.name+' '+g.fields.flat().join(' ')).toLowerCase().includes(query));let g=groups.find(g=>g.id===c.group)||groups[0];if(g)c.group=g.id;const changes=configChanges();let body='';if(g){body='<h3>'+esc(g.name)+'</h3><p class="hint">'+esc(g.owner)+' · kit · base r'+c.base+'</p>';if(g.id==='agents')body+='<div class="actions">'+button('Tạo agent mới','definition-new','','primary')+link('Skills / principles đã nạp','resources')+'</div>';body+=g.fields.map(([name,def,type],i)=>{const key=g.id+':'+i,k=draftKey('kit',key),value=k in c.draft?c.draft[k]:effectiveConfig('kit',key);let control;if(type==='number')control='<input type="number" min="1" '+(key==='limits:0'?'max="10"':'')+' data-config-key="'+key+'" value="'+esc(value)+'">';else{const options=type==='definition'?S.agentDefinitions.map(d=>[d.id,d.name]):['allow','ask','deny'].map(v=>[v,v]);control='<select data-config-key="'+key+'">'+options.map(([v,label])=>'<option value="'+v+'" '+(v===value?'selected':'')+'>'+esc(label)+'</option>').join('')+'</select>';}return '<label class="field"><span>'+esc(name)+'</span>'+control+'<small>Active: '+esc(effectiveConfig('kit',key))+' · r'+c.revision+'</small></label>';}).join('');if(g.id==='agents')body+=definitionCards();if(g.id==='limits')body+='<p class="hint">Budget USD: unavailable trong fixture; không có input giả. Deadline/retries phải do runtime enforce thật.</p>';if(g.id==='actions')body+='<p class="hint">Native scope đọc/ghi/test hiện có: '+(S.permissions.write&&S.permissions.test?'write/test đã cấp':'chưa đủ write/test; chỉ xin khi work cần')+'. Quyền native được quản lý tại Paseo; Actions không mở rộng chúng.</p>';if(g.id==='automations')body+='<p>'+S.jobs.length+' code jobs · '+S.schedules.length+' native source refs. Cadence không lưu lần hai ở settings.</p><div class="actions">'+link('Jobs & schedules','schedules','primary')+link('Native agent schedules','paseo/schedules')+'</div>';body+='<div class="callout small">'+esc(g.advanced)+'</div><p class="hint">Áp dụng: '+esc(g.effect)+'</p>';}else body=empty('Không có nhóm khớp tìm kiếm.');return panel('Cấu hình — chỉ phần người vận hành cần chọn','<p>Tạo/sửa Agent Definition: native profile refs, fallback, Skills và principle policy. Danh mục agent gắn cấu hình này với trách nhiệm/procedures. Paseo cung cấp runtime/provider.</p><div class="config-summary">'+badge('active r'+c.revision)+'<span class="badge">Observed r'+c.observed+'</span><span class="badge">'+changes.length+' trường nháp</span></div>'+field('Tìm trong bốn nhóm','config-search',c.query,'search','data-config-search')+'<div class="config-layout"><nav class="config-nav">'+groups.map(x=>button(x.name,'config-group',x.id,x.id===g?.id?'selected':'')).join('')+'</nav><div class="config-fields">'+body+'</div></div><div class="actions">'+button('Xem thay đổi','config-preview','','primary')+button('Bỏ bản nháp','config-reset')+button('Đọc revision hiện tại','config-rebase')+'</div>'+((c.preview||c.errors.length)?'<div class="config-diff"><h3>Diff / ảnh hưởng</h3>'+(c.errors.length?'<div class="alert">'+c.errors.map(esc).join('<br>')+'</div>':'')+(changes.length?changes.map(x=>'<div class="row"><b>'+esc(x.group.name+' / '+x.field)+'</b><p>'+esc(x.old)+' → '+esc(x.value)+'</p><small>'+esc(x.group.effect)+'</small></div>').join(''):empty('Chưa có nháp.'))+button('Áp dụng thay đổi (mô phỏng)','config-activate','','primary')+'</div>':'')+'<div class="actions">'+button('Mô phỏng observed sync','config-sync')+link('Lịch sử settings','history')+'</div><details><summary>Điều khiển fixture conflict / capability</summary>'+button('Mô phỏng sửa settings từ chat','config-stale')+button(c.capabilityMissing?'Khôi phục capability':'Mô phỏng thiếu capability','config-capability')+'</details><details><summary>Khôi phục revision settings</summary>'+(c.history.length?c.history.map(v=>'<div class="row">r'+v.revision+' '+button('Khôi phục thành revision mới','config-restore',String(v.revision))+'</div>').join(''):'Chưa có snapshot.')+'</details>','C01 / C02 · Agents · Limits · Actions · Automations');}
function schedulesView(idValue){if(idValue?.startsWith('schedule-'))return nativeSourcesView(idValue);let form='';if(S.jobDraft){const d=S.jobDraft;form=panel(d.id?'Sửa code job':'Thêm code job','<form data-form="code-job"><input type="hidden" name="id" value="'+esc(d.id||'')+'"><input type="hidden" name="revision" value="'+(d.revision||0)+'"><div class="grid">'+field('Tên job','name',d.name)+selectField('Handler có version','handler',[['backlog.sync@1','Đồng bộ Backlog'],['pr.comments.poll@1','Kiểm comment PR']],d.handler)+field('Cron (fixture)','cron',d.cron)+selectField('Timezone','timezone',[['Asia/Ho_Chi_Minh','Asia/Ho_Chi_Minh'],['UTC','UTC']],d.timezone)+field('Timeout giây','timeout',d.timeout,'number','min="1" max="300"')+'</div><p class="hint">Overlap: skip · missed: coalesce · retries bounded. Inputs/credentials chỉ tham chiếu adapter đã được cấp quyền; không nhập shell hoặc secret.</p><div class="actions"><button class="primary" type="submit">Lưu code job mô phỏng</button>'+button('Hủy nháp','job-close')+'</div></form>');}const cards=S.jobs.map(j=>panel(j.name,'<p><b>Code handler:</b> '+esc(j.handler)+' → inbox '+esc(j.owner)+'</p><p>'+esc(j.cron)+' · '+esc(j.timezone)+' · timeout '+j.timeout+'s · r'+j.revision+'</p><p>Desired: '+(j.paused?'paused':'enabled')+' · cursor '+esc(j.cursor)+' · next run: chưa tính trong HTML</p><div class="actions">'+button('Sửa job','job-edit',j.id)+button(j.paused?'Bật lại job':'Dừng lịch job','job-toggle',j.id)+'</div><details open><summary>Run once / kết quả API giả lập</summary><p class="hint">Thủ công vẫn có thể chạy khi lịch paused. Hai nút chỉ chọn kết quả fixture; không gọi API/LLM.</p>'+button('Poll không có thay đổi','job-empty',j.id)+button('Poll có delta / lặp cùng delta','job-delta',j.id)+'</details><p>Lần gần nhất: '+esc(j.runs[0]?.outcome||'Chưa chạy')+'</p>'+(j.runs.length?'<details><summary>Run history</summary>'+j.runs.map(run=>'<p>'+esc(run.id)+' · '+esc(run.outcome)+' · '+esc(run.at)+'</p>').join('')+'</details>':''))).join('');return panel('Code jobs — chạy bằng code','<p>Sync/poll cố định không cần agent. Chỉ phát tín hiệu khi dữ liệu thay đổi; agent xử lý sau qua inbox/admission.</p>'+button('Thêm code job','job-new','','primary')+form+cards+'<h3>Events chờ xử lý</h3>'+(S.jobEvents.length?S.jobEvents.map(e=>'<div class="row"><b>'+esc(e.type)+'</b><p>'+esc(e.sourceId)+' → inbox '+esc(e.owner)+' · pending (fixture)</p></div>').join(''):empty('Chưa có delta; không đánh thức agent.')),'Không có cron engine/API poll thật trong HTML')+nativeSourcesView();}
function runCodeJob(job,changed){if(!job||!online())return;const sourceId=job.handler.startsWith('backlog')?'backlog:task-42:revision-2':'pr:17:comment-95';const duplicate=job.seen.includes(sourceId)||S.jobEvents.some(e=>e.sourceId===sourceId&&e.owner===job.owner);const run={id:id('jobrun'),at:stamp(),outcome:!changed?'unchanged':duplicate?'duplicate delta — bỏ qua':'changed — đã ghi event/outbox fixture'};if(changed&&!duplicate){job.seen.push(sourceId);S.jobEvents.unshift({id:id('jobevent'),sourceId,owner:job.owner,type:job.handler.startsWith('backlog')?'TaskUpdated':'PRCommentAdded',job:job.id});job.cursor='fixture:after';}job.runs.unshift(run);audit('code-job',job.name+': '+run.outcome,'schedules');notice='Code job kết thúc: '+run.outcome+'. Không tạo hoặc wake agent trong fixture.';}
function nativeSourcesView(idValue){if(idValue){const t=S.schedules.find(x=>x.id===idValue);if(!t)return notFound();const rows=S.deliveries.filter(x=>x.schedule===t.id);return panel('Binding '+t.name,'<p>Native source: paseo:'+esc(t.id)+' · '+esc(t.cadence)+' · '+esc(t.timezone)+' (snapshot chỉ đọc)</p><div class="actions">'+link('Sửa lịch / pause / run once tại Paseo','paseo/schedules')+link('Các binding','schedules')+'</div><form data-form="trigger-policy"><input type="hidden" name="id" value="'+esc(t.id)+'"><input type="hidden" name="revision" value="'+t.revision+'">'+selectField('Workflow overlap','overlap',[['skip','Skip'],['queueOne','Queue one'],['queueAll','Queue all']],t.overlap)+selectField('Missed policy yêu cầu','missed',[['skip','Skip'],['latest','Latest nếu adapter chứng minh'],['all','All nếu adapter chứng minh']],t.missed)+'<p class="hint">Prototype chỉ kiểm policy fixture. Chưa đủ occurrence evidence trên host thật thì policy tương ứng unavailable.</p><button class="primary" type="submit">Lưu policy của harness</button></form><h3>Delivery → Work</h3>'+(rows.length?rows.map(d=>'<div class="row">'+esc(d.occurrence)+' '+link('Work '+d.runId,'run/'+d.runId)+'</div>').join(''):empty('Chưa nhận delivery.'))+'<details><summary>Điều khiển fixture để review adapter</summary>'+button('Mô phỏng callback từ Paseo','schedule-run',t.id)+button('Mô phỏng callback lặp','schedule-duplicate',t.id)+'</details>','T02 · Harness receipt / admission, không có cron engine');}return panel('Trigger bindings','<p>Paseo quản lý lịch tạo agent và heartbeat. Harness tham chiếu các nguồn đó; code jobs bên dưới có lịch riêng do harness sở hữu.</p><div class="actions">'+link('Mở Paseo Schedules','paseo/schedules')+link('Nhờ harness gắn nguồn / daily retro','harness')+'</div><div class="list">'+S.schedules.map(t=>'<button class="list-row" data-action="nav" data-id="schedules/'+t.id+'"><div><strong>'+esc(t.name)+' → inbox '+esc(t.owner)+'</strong><small>paseo:'+esc(t.id)+' · snapshot '+esc(t.cadence)+' · source '+(t.paused?'paused':'enabled')+' (chỉ đọc)</small></div><span class="badge">Policy r'+t.revision+'</span></button>').join('')+'</div>','T01 · Native cadence tham chiếu, workflow policy riêng');}
function improvementsView(idValue){if(idValue){const i=S.improvements.find(i=>i.id===idValue);if(!i)return notFound();return panel(i.title,badge(i.status)+'<p><b>Hypothesis:</b> '+esc(i.hypothesis)+'</p><div class="grid">'+panel('Baseline','<p>'+esc(i.baseline)+'</p><small>Dataset/suite fixture · không phải số đo thật</small>')+panel('Candidate','<p>'+esc(i.candidate)+'</p><p>Pinned config r'+i.configRevision+'</p>')+'</div>'+(i.teamCandidate?panel('Đổi catalog · không đổi settings','<p>Đội r'+i.teamBase+' → r'+i.teamCandidate.revision+'</p><p>'+esc(i.teamDiff)+'</p><p>Settings/permissions/worker ceiling giữ nguyên. Chỉ assignment mới nhận bundle mới.</p>'):'')+'<ol class="timeline">'+i.timeline.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="actions">'+(['proposal','evaluating'].includes(i.status)?button('Mô phỏng eval đạt → kiểm authority','improvement-pass',i.id,'primary')+button('Mô phỏng eval không đạt','improvement-fail',i.id):'')+(i.status==='awaiting-decision'&&S.config.active['actions:4']==='ask'?button('Cho phép activation lần này (mô phỏng)','improvement-approve',i.id,'primary'):'')+(['monitoring','retained'].includes(i.status)?button('Mô phỏng regression','improvement-regress',i.id)+button(S.compatible?'Mô phỏng migration không tương thích':'Mô phỏng compatibility đã kiểm','improvement-compat',i.id):'')+(i.status==='needs-fix'?button(i.fixApprovalRevision===S.config.revision?'Cho phép activation bản sửa lần này':'Bản sửa catalog + kiểm đạt (fixture)','improvement-fix',i.id,'primary'):'')+(['blocked','awaiting-decision'].includes(i.status)?button('Kiểm lại điều kiện activation','improvement-recheck',i.id)+link('Authority settings','config')+link('Recovery / compatibility','recovery'):'')+link('Evidence liên quan','evidence')+link('Chat harness','harness')+'</div><p class="hint">Các nút là điều khiển kịch bản eval, không phải thêm phê duyệt của người vào mọi cải tiến. Activation thật phải đủ evidence/quyền/compatibility.</p>','I02 · '+i.id);}return panel('Cải tiến & daily retro','<div class="actions">'+button('Mô phỏng retro có bằng chứng','retro','','primary')+button('Mô phỏng retro thiếu bằng chứng','retro-empty')+'</div>'+(S.improvements.length?'<div class="list">'+S.improvements.map(i=>'<button class="list-row" data-action="nav" data-id="improvements/'+i.id+'"><div><strong>'+esc(i.title)+'</strong><small>'+esc(i.hypothesis)+'</small></div>'+badge(i.status)+'</button>').join('')+'</div>':empty('Chưa có candidate. Không bắt buộc mỗi retro phải tạo thay đổi.')),'I01 · Cải tiến chính harness và Project Orchestrator');}
function evidenceView(idValue){const list=idValue?S.evidence.filter(e=>e.id===idValue):S.evidence;if(idValue&&!list.length)return notFound();return panel(idValue?'Chi tiết bằng chứng':'Bằng chứng',list.length?list.map(e=>'<article class="evidence-card"><h3>'+esc(e.title)+'</h3>'+badge(e.outcome)+'<p>'+esc(e.summary)+'</p><small>'+esc(e.id)+' · '+esc(e.ref)+' · config r'+e.configRevision+' · '+esc(e.criteriaRevision)+'</small><pre>'+esc(e.details)+'</pre><div class="actions">'+(e.runId?link('Mở work','run/'+e.runId):'')+(e.improvement?link('Mở candidate','improvements/'+e.improvement):'')+(!idValue?link('Xem evidence','evidence/'+e.id):link('Danh sách evidence','evidence'))+'</div></article>').join(''):empty('Chưa có evidence. Tạo agent hoặc kết thúc turn chưa đủ để có verdict.'),'E01 · Fixture không chứng minh tính đúng của hệ thật');}
function historyView(){const entries=S.audit.filter(a=>!S.historyFilter||S.historyFilter==='all'||a.kind===S.historyFilter);return panel('Nhật ký thay đổi','<div class="filterbar">'+['all','config','work','delivery','release','decision'].map(k=>button(k==='all'?'Tất cả':k,'history-filter',k,(S.historyFilter||'all')===k?'selected':'')).join('')+'</div>'+(entries.length?'<div class="list">'+entries.map(a=>'<div class="row"><small>'+esc(a.at)+' · '+esc(a.kind)+'</small><b>'+esc(a.text)+'</b>'+(a.ref?'<div class="actions">'+link('Mở đối tượng',a.ref)+'</div>':'')+'</div>').join('')+'</div>':empty('Chưa có thay đổi trong bộ lọc này.')),'A01 · Giữ lịch sử, không chỉnh verdict cũ');}
function recoveryView(){if(S.plugin==='failed')return '<section class="recovery-companion"><div class="eyebrow">Recovery companion · ngoài plugin lỗi</div><h1>Plugin mới không khởi động</h1><p>Panel plugin thật sẽ không hoạt động. Khung này minh họa executable độc lập từ bản phục hồi đã kiểm, không phải plugin lỗi tự sửa chính nó.</p><div class="grid">'+panel('Release / store','<p>Phiên bản đang có hiệu lực: '+esc(activeReleaseVersion()||'không có')+' · phiên bản được chọn để phục hồi: '+esc(recoveryReleaseVersion())+'</p><p>Compatibility: '+(S.compatible?'có đường lùi tương thích':'migration chưa tương thích')+'</p>')+panel('Durable state','<p>'+S.workItems.length+' yêu cầu · '+S.workflowRuns.length+' lượt chạy · '+S.assignments.length+' lần giao việc · '+S.agentSessions.length+' Sessions đã biết · config r'+S.config.revision+'</p><p>Không tạo worker thay thế trước đối soát.</p>')+'</div><p class="hint">Executable recovery đi cùng plugin; trạng thái ghi ngoài UI plugin. Cần kiểm schema và ownership trước phục hồi.</p><div class="actions">'+button('Mô phỏng recovery độc lập','recover-plugin','','primary')+button(S.compatible?'Mô phỏng migration không tương thích':'Mô phỏng restore tương thích đã kiểm','recovery-compat')+'</div>'+(!S.compatible?'<div class="alert">Rollback code đơn thuần đang bị chặn. Cần maintenance/backup-restore hoặc đường tiến tiếp đã kiểm chứng. Thao tác restore mô phỏng không chạm dữ liệu thật.</div>':'')+'</section>';return panel('Kết nối & recovery','<div class="grid">'+panel('Host / reconnect','<p>'+esc(S.setup.hostName)+' · '+(S.host?'kết nối':'offline')+'</p><p>Đối soát gần nhất: '+esc(S.lastReconcile)+'</p><div class="actions">'+button(S.host?'Mô phỏng mất kết nối':'Nối lại và reconcile mô phỏng','host','','primary')+'</div>')+panel('Plugin / release','<p>Phiên bản đang có hiệu lực: '+esc(activeReleaseVersion()||'không có')+' · phiên bản được chọn để phục hồi: '+esc(recoveryReleaseVersion())+'</p><p>Store: '+(S.compatible?'có đường phục hồi tương thích':'migration chưa tương thích; chặn code rollback')+'</p>'+button('Mô phỏng update không boot','plugin-fail')+button(S.compatible?'Mô phỏng migration không tương thích':'Mô phỏng restore tương thích đã kiểm','recovery-compat'))+'</div><div class="callout">Offline giữ snapshot/nháp nhưng chặn effect mới. Reconnect giữ đúng WorkRef và agent assignment; không hứa exactly-once side effect.</div>','R01 · Host startup và recovery thật còn cần spike');}

function definitionEditorView(id){if(id==='new'&&(!S.definitionDraft||S.definitionDraft.id)){S.definitionDraft=definitionTemplate();S.definitionErrors=[];}if(!S.definitionDraft||(id!=='new'&&S.definitionDraft.id!==id)){const d=definitionById(id);if(!d)return notFound();S.definitionDraft=JSON.parse(JSON.stringify(d));S.definitionErrors=[];}const d=S.definitionDraft,skills=S.resources.filter(r=>r.kind==='skill'),principles=S.resources.filter(r=>r.kind==='principle');const models=d.profileRefs.map((ref,i)=>{const p=nativeProfile(ref);return panel(i===0?'Profile chính':'Profile dự phòng '+i,selectField('Chọn profile đã tạo trong Paseo','nativeProfile-'+i,[['','Chọn profile native…'],...NATIVE_PROFILES.map(p=>[p.id,p.name])],ref)+'<p class="hint">'+(p?esc(p.provider+' · '+p.model+' · thinking '+p.thinking+' · mode '+p.mode):'Chưa chọn hoặc profile không còn tồn tại.')+'</p><div class="actions">'+(i>0?button('↑ Ưu tiên cao hơn','definition-model-up',String(i)):'')+(i<d.profileRefs.length-1?button('↓ Ưu tiên thấp hơn','definition-model-down',String(i)):'')+(i>0?button('Bỏ profile dự phòng','definition-model-remove',String(i)):'')+'</div>');}).join('');return panel(d.id?'Sửa cấu hình agent':'Tạo cấu hình agent','<p>Tạo profile native trong Paseo → Agents trước, rồi chọn ở đây. Harness bổ sung fallback, skills và principles. Danh sách native dưới đây là fixture đọc, chưa nối host thật. Skills bên dưới được chỉ định tường minh khi giao việc; agent có thể thấy Skills khác từ host.</p><form data-form="agent-definition"><div class="grid">'+field('Tên cấu hình','name',d.name)+'</div><label class="field"><span>Khi nào nên dùng</span><textarea name="description" rows="2">'+esc(d.description)+'</textarea></label><label class="agent-enabled"><input type="checkbox" name="enabled" '+(d.enabled?'checked':'')+'> Có thể chọn cho lượt mới</label><h3>Profile chính và profile dự phòng theo thứ tự</h3>'+link('Mở Agent profiles trong Paseo','paseo/profiles')+(!NATIVE_PROFILES.length?'<div class="alert">Chưa có profile native. Tạo profile trong Paseo trước rồi quay lại chọn; harness không tự tạo thay.</div>':'')+''+models+'<div class="actions">'+button('Thêm profile dự phòng','definition-model-add')+'</div><p class="hint">Provider/model/thinking/mode kế thừa nguyên từ profile native; chỉnh chúng trong Paseo. Không fallback khi bị deny, thiếu skill bắt buộc hoặc sai output contract. Ask/Auto không nới Actions của kit.</p><h3>Skills agent được sử dụng</h3><p>Chọn từ bộ đã nạp; entry skill của procedure phải có trong danh sách. Đây không phải cấp quyền tools.</p>'+field('Lọc skills','skill-search','','search','data-resource-search="skills"')+'<div class="resource-picks" data-resource-list="skills">'+skills.map(r=>resourceChoice(r,'skills',d.skills)).join('')+'</div><div class="actions">'+link('Nạp thêm skills / principles','resources')+'</div><h3>Nguyên tắc</h3>'+selectField('Cách chọn nguyên tắc','principleMode',[['auto','Agent tự chọn'],['fixed','Danh sách cố định'],['hybrid','Kết hợp']],d.principleMode)+'<p class="hint">Auto: worker chọn theo task, các tick cố định dưới đây không áp dụng. Fixed: dùng danh sách bạn chọn, có thể rỗng. Hybrid: giữ danh sách bắt buộc rồi bổ sung theo việc.</p><details '+(d.principleMode!=='auto'?'open':'')+'><summary>Chọn nguyên tắc cố định / bắt buộc ('+d.principles.length+')</summary><div class="resource-picks">'+principles.map(r=>resourceChoice(r,'principles',d.principles)).join('')+'</div></details><p>Operating rules về quyền, bằng chứng và chất lượng luôn áp dụng, không bị tắt bởi principle policy.</p>'+(S.definitionErrors.length?'<div class="alert">'+S.definitionErrors.map(esc).join('<br>')+'</div>':'')+'<div class="actions"><button type="submit" class="primary">Lưu revision cho lượt mới</button>'+button('Preview theo task replay','definition-preview')+button('Hủy / về Agents','definition-close')+'</div><p class="hint">Revision đọc lúc mở: '+d.revision+'. Save là thay đổi tường minh của người vận hành, pin nguồn resourc function resourcesView(){return panel('Bộ skills & principles đã nạp','<p class="callout">Chọn Skills để chỉ định tường minh khi giao việc. Agent có thể thấy Skills khác từ host; không yêu cầu catalog riêng.</p><p>Chọn thư mục bộ đã có trên máy để đọc metadata các file SKILL.md. Không upload, không execute, không có secret. Bản tích hợp thật sẽ dùng đường dẫn/catalog trên host Paseo; browser file input chỉ minh họa import cục bộ.</p><div class="grid"><label class="field"><span>Nạp thư mục skills</span><input type="file" webkitdirectory directory multiple data-import-kind="skill"></label><label class="field"><span>Nạp thư mục principles</span><input type="file" webkitdirectory directory multiple data-import-kind="principle"></label></div><p class="hint">Nguồn fixture tách khỏi nguồn local. Import chỉ lưu name/description/source/fingerprint trong fixture; không lưu toàn bộ nội dung SKILL.md.</p>'+['skill','principle'].map(kind=>'<h3>'+kind+' ('+S.resources.filter(r=>r.kind===kind).length+')</h3>'+S.resources.filter(r=>r.kind===kind).map(r=>'<div class="row"><b>'+esc(r.name)+'</b><p>'+esc(r.description)+'</p><small>'+esc(r.source)+' · '+esc(r.revision)+'</small></div>').join('')).join('')+'<div class="actions">'+link('Về Agents','config')+link('Danh mục agent','team')+'</div>','A-D04 · Nguồn có revision; không giả đã scan daemon');}
function readResourceMetadata(file,text,kind){if(file.name.toLowerCase()!=='skill.md')return null;if(text.length>200000)throw Error('SKILL.md quá lớn cho import metadata fixture.');const front=text.startsWith('---')?text.split('---')[1]:'';const match=front.match(/^name:\s*(.+)$/m),desc=front.match(/^description:\s*(.+)$/m),path=file.webkitRelativePath||file.name,folder=path.split('/').slice(-2,-1)[0]||'',name=(match?.[1]||folder).trim().replace(/^['"]|['"]$/g,'');if(!name||name.length>160||/[<>\n\r]/.test(name))throw Error('Metadata thiếu name hợp lệ: '+path);let hash=2166136261;for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619);}return {id:name,name,kind,description:(desc?.[1]||'Metadata local; xem nguồn trước sử dụng.').replace(/^['"]|['"]$/g,''),source:'local:'+path,revision:'metadata-fnv32-'+(hash>>>0).toString(16)};}
async function importResources(files,kind){if(!files.length)return;if(files.length>1000){notice='Chọn thư mục gọn hơn: tối đa 1000 files trong fixture.';render();return;}const incoming=[];try{for(const file of files){if(file.name.toLowerCase()!=='skill.md')continue;incoming.push(readResourceMetadata(file,await file.text(),kind));}if(!incoming.length)throw Error('Không thấy SKILL.md hợp lệ.');let changed=false;for(const r of incoming){const at=S.resources.findIndex(old=>old.kind===kind&&old.id===r.id);if(at>=0){if(S.resources[at].revision!==r.revision||S.resources[at].source!==r.source){S.resources[at]=r;changed=true;}}else{S.resources.push(r);changed=true;}}if(changed)S.resourceRegistryRevision++;notice='Đã nạp metadata '+incoming.length+' '+kind+' từ local, không upload/execute. Definition dùng nguồn đã đổi cần kiểm và lưu lại trước lượt mới.';audit('resources','Nạp metadata '+kind+': '+incoming.length,'resources');}catch(error){notice='Import không áp dụng: '+error.message;}save();render();}

function render(){v1Ensure();lifecycleEnsure();let base=S.route.split('/')[0],arg=S.route.split('/')[1];if(S.plugin==='failed'){base='recovery';S.route='recovery';}let html;switch(base){case 'lifecycle':html=lifecycleView(arg);break;case 'setup':html=setupView();break;case 'paseo':html=nativeView(arg);break;case 'project':html=lifecycleView('project');break;case 'harness':html=lifecycleView('harness');break;case 'overview':html=overviewView();break;case 'work-items':html=workItemsView();break;case 'work-item':html=workItemView(arg);break;case 'run':case 'activity':html=runView(arg)+v1RunView(arg);break;case 'assignments':case 'agents':html=assignmentsView();break;case 'assignment':case 'agent':html=assignmentView(arg);break;case 'session':html=sessionView(arg);break;case 'inbox':html=inboxView(arg);break;case 'config':html=configView();break;case 'team':html=teamView(arg);break;case 'definitions':html=definitionEditorView(arg);break;case 'resources':html=resourcesView();break;case 'schedules':html=v1SchedulerView(arg);break;case 'analytics':html=v1AnalyticsView();break;case 'releases':html=v1ReleasesView();break;case 'improvements':html=improvementsView(arg)+(!arg?'<div class="actions">'+link('Cập nhật toàn plugin','releases')+'</div>':'');break;case 'evidence':html=evidenceView(arg);break;case 'history':html=historyView();break;case 'recovery':html=v1RecoveryView();break;default:html=notFound();}document.getElementById('root').innerHTML=shell(html);document.title='Project Harness prototype · '+base;}
function online(){if(S.host&&S.provider&&S.plugin==='healthy')return true;notice='Chưa thể dispatch/kích hoạt: host offline hoặc plugin lỗi. Snapshot và nháp vẫn được giữ.';return false;}
function workTimeline(a,text){a.revision++;a.timeline.push({at:stamp(),text});a.checkpoint=text;}
function syncRunAssignments(run){prototypeModel().syncRun(run.id);}

function ensureWorker(run,reuseSessionId=''){
 if(run.kind==='wake'||run.bundle?.errors?.length)return;
 if(S.assignments.some(a=>a.runId===run.id))return;
 let session=reuseSessionId?S.agentSessions.find(g=>g.id===reuseSessionId):null;
 if(reuseSessionId&&!session)throw new Error('SESSION_NOT_FOUND');
 if(!session){session={id:id('session'),owner:run.owner,role:run.bundle?.role||'worker',status:'idle',provider:run.bundle?.model?.provider||'unavailable',model:run.bundle?.model?.model||'unavailable',tools:['Theo role và quyền thật'],context:'Native Session fixture'};S.agentSessions.unshift(session);}
 prototypeModel().assign(run.id,session.id,run.bundle);
}

function evidenceFor(a,pass){const e={id:id('evidence'),title:pass?'Kết quả kiểm chứng đạt (mô phỏng)':'Kết quả chưa đạt (mô phỏng)',outcome:pass?'completed':'failed',summary:pass?'Các điều kiện bắt buộc trong fixture đã có bằng chứng.':'Một điều kiện bắt buộc chưa đạt; không công nhận completed.',ref:'fixture:'+a.id,configRevision:a.configRevision,criteriaRevision:a.criteriaRevision,runId:a.id,details:'Dataset: fixture-ui-v1\nTrial: 1 (mô phỏng)\nOutcome: '+(pass?'accepted':'rejected')+'\nKhông gọi test runner hoặc provider thật.'};S.evidence.unshift(e);a.evidence.push(e.id);return e;}
function stepWork(a){if(!a||!online())return;if(v1AdmissionBlocked(a.owner,a.id)){notice='Maintenance: dừng admission mới tới khi cập nhật và đối soát hoàn tất.';return;}if(a.status==='pausing'){a.status='paused';workTimeline(a,'Provider acknowledge pause giả lập; giữ checkpoint.');}else if(a.status==='cancelling'){a.status='cancelled';workTimeline(a,'Cancel acknowledge giả lập; giữ artifact/side effect cần đối soát.');}else if(a.status==='paused'){notice='Work đang paused; chọn Tiếp tục trước khi tiến bước.';return;}else if(a.status==='blocked'){if(a.bundle?.errors?.length){notice=a.bundle.errors.join(' ');return;}if(a.blocker==='budget'){notice='Giới hạn chưa được thay đổi; mở config để người có quyền quyết định. Không tự tăng trần.';return;}if(a.owner==='project'&&(!S.permissions.write||!S.permissions.test)){notice='Chưa đủ quyền write/test; mở config hoặc quyết định liên quan.';return;}a.status='queued';a.reason='';ensureWorker(a);workTimeline(a,'Đã đối soát điều kiện chặn; đưa lại vào admission.');}else if(a.status==='queued'){const used=S.workflowRuns.filter(w=>w.id!==a.id&&w.kind!=='wake'&&['running','evaluating'].includes(w.status)).length;if(a.kind!=='wake'&&used>=S.workerLimit){a.reason='Chờ worker ceiling '+S.workerLimit+'; không tự nâng giới hạn.';notice=a.reason;return;}a.reason='';a.status='running';a.step=1;ensureWorker(a);workTimeline(a,'Worker nhận assignment; thực hiện trong phạm vi đã cấp.');}else if(a.status==='running'){a.status='evaluating';a.step=2;workTimeline(a,'Agent kết thúc bước; runtime đang kiểm schema/evidence, chưa completed.');}else if(a.status==='evaluating'){const e=evidenceFor(a,true);a.status='completed';a.step=3;workTimeline(a,'Outcome accepted gắn evidence '+e.id+'.');if(a.kind==='verification'){S.verified=true;S.stage='operational';message('project','agent','Công việc kiểm chứng '+a.id+' đã đạt trong fixture. Năng lực tương ứng được công nhận; không suy ra mọi năng lực đều đã kiểm.',{runId:a.id});}else message(a.owner,'agent','Kết quả '+a.id+' có evidence; bạn có thể đọc chi tiết và trao đổi tiếp trong chat.',{runId:a.id});S.inbox.filter(i=>i.runId===a.id&&i.status!=='decision').forEach(i=>i.status='working');if(a.kind==='capability')message('project','agent','Yêu cầu năng lực liên kết đã có kết quả từ harness; tôi giữ cuộc trao đổi dự án tại đây.',{runId:a.id});}else{notice='Hoạt động đã terminal; không sửa kết quả cũ.';return;}syncRunAssignments(a);audit('work',a.id+' → '+a.status,'run/'+a.id);}
function startVerification(kind){if(!online())return;const title=kind.startsWith('custom:')?kind.slice(7):kind==='ui'?'Kiểm chứng luồng UI đại diện':S.setup.branch==='new'?'Dựng lát cắt chức năng đầu tiên':'Sửa lỗi giỏ hàng trên mobile';const a=submitAndStartRun(title,'project','verification');S.stage='verification';if(!S.permissions.write||!S.permissions.test){a.status='blocked';a.reason='Thiếu quyền write/test cần cho công việc đại diện.';workTimeline(a,'Chặn trước dispatch vì thiếu quyền bắt buộc.');const i=addInbox('Cần phạm vi chạy công việc kiểm chứng','decision',a.id);message('project','agent','Tôi cần làm rõ/cấp phạm vi cho việc kiểm chứng. Yêu cầu liên kết được lưu; chưa dispatch worker.',{runId:a.id,inbox:i.id});}else message('project','agent','Tôi nhận công việc kiểm chứng đại diện trong worktree, theo config/criteria đã pin. Không publish/merge.',{runId:a.id});nav('run/'+a.id);}
function deliverSchedule(s,duplicate=false){if(!online())return;if(duplicate){const existing=S.deliveries.find(d=>d.schedule===s.id);if(!existing){notice='Chưa có occurrence để phát lại. Chạy một lượt trước.';return;}const before=S.workflowRuns.length;const a=S.workflowRuns.find(w=>w.id===existing.runId)||submitAndStartRun(s.name,s.owner,s.action==='wake'?'wake':'scheduled','schedule',existing.occurrence);notice='Delivery lặp đối soát cùng '+a.id+'. Không tạo thêm work ('+before+' → '+S.workflowRuns.length+').';audit('delivery','Phát lại '+existing.occurrence+' → '+a.id,'run/'+a.id);return;}s.manual++;const occurrence=s.id+':r'+s.revision+':manual-'+s.manual;const pending=s.action==='wake'?S.workflowRuns.find(w=>w.owner===s.owner&&w.kind==='wake'&&!['completed','failed','cancelled'].includes(w.status)):null;const a=pending||submitAndStartRun(s.name,s.owner,s.action==='wake'?'wake':'scheduled','schedule',occurrence);if(s.action==='wake')message(s.owner,'agent','Nhận wake mô phỏng cho logical owner; pending wake được gom, không tạo orchestrator thứ hai.',{runId:a.id});S.deliveries.unshift({id:id('delivery'),schedule:s.id,revision:s.revision,occurrence,scheduled:'manual · '+stamp(),received:stamp(),status:'accepted (mô phỏng)',runId:a.id});audit('delivery','Nhận '+occurrence,'run/'+a.id);notice='Đã nộp '+a.id+' một lần. Lịch '+(s.paused?'vẫn paused.':'không đổi.');}
function newImprovement(){if(!online())return;const i={id:id('improve'),title:'Giảm sửa lại sau review',hypothesis:'Thêm phép kiểm trước review để giảm lỗi lặp mà giữ tiêu chí bắt buộc.',baseline:'Fixture baseline quality=đạt; repeated rework=3 (ví dụ)',candidate:'Harness candidate 0.2.0',oldRelease:activeReleaseVersion(),configRevision:S.config.revision,status:'proposal',timeline:['Hypothesis được ghi cùng phạm vi và nguồn evidence fixture.']};S.improvements.unshift(i);audit('improvement','Tạo candidate '+i.id,'improvements/'+i.id);nav('improvements/'+i.id);}
function mutatePermissions(note,mutate){const c=S.config;c.history.unshift({revision:c.revision,active:{...c.active},overrides:JSON.parse(JSON.stringify(c.overrides||{})),permissions:{...S.permissions},workerLimit:S.workerLimit,minutesLimit:S.minutesLimit,note:'Snapshot trước thay đổi quyền/giới hạn'});mutate();c.revision++;c.observed=c.revision;if(!Object.keys(c.draft).length)c.base=c.revision;audit('config',note+' · r'+c.revision,'config');}
function applyConfigChanges(){const c=S.config,changes=configChanges();if(!changes.length){notice='Chưa có thay đổi.';return false;}c.history.unshift({revision:c.revision,active:{...c.active},permissions:{...S.permissions},workerLimit:S.workerLimit,minutesLimit:S.minutesLimit,note:'Trước thay đổi settings'});const oldMinutes=S.minutesLimit;for(const x of changes)c.active[x.path]=x.value;S.workerLimit=+c.active['limits:0'];S.minutesLimit=+c.active['limits:1'];if(S.minutesLimit>oldMinutes)for(const a of S.workflowRuns.filter(a=>a.blocker==='budget')){a.blocker='';a.status='queued';a.reason='';workTimeline(a,'Người vận hành đổi trần, đưa lại admission; chưa completed.');}c.revision++;c.draft={};c.base=c.revision;c.preview=false;c.errors=[];audit('config','Settings r'+c.revision+' cho lượt mới; quyền/trần không đổi từ catalog','config');notice='Active settings r'+c.revision+'; observed r'+c.observed+'. Work/assignment cũ giữ bundle đã pin.';return true;}
function handleAction(action,key){const a=S.workflowRuns.find(a=>a.id===key),s=S.schedules.find(s=>s.id===key),i=S.inbox.find(i=>i.id===key),imp=S.improvements.find(i=>i.id===key);switch(action){
case 'nav':nav(key);return;
case 'dismiss':notice='';break;
case 'scenario':{const selected=key||document.querySelector('[name=scenario]')?.value||'fresh';setScenario(selected);return;}
case 'host':S.host=!S.host;if(S.host){S.lastReconcile=stamp();audit('reconcile','Đã nối lại snapshot: nhận lại work/assignment, không tạo thay worker','recovery');notice='Đã đối soát mô phỏng. Số work/agent giữ nguyên.';}else notice='Host offline mô phỏng; chặn effect mới, giữ snapshots/nháp.';break;
case 'verify-start':startVerification(key);return;
case 'capability':{if(!online())break;const item=addInbox('Bổ sung browser tool cho project','capability');message('project','agent','Tôi đã tạo yêu cầu năng lực liên kết tới harness. Nội dung nghiệp vụ tiếp tục trong chat này.',{inbox:item.id});message('harness','agent','Nhận yêu cầu browser capability từ Project Orchestrator.',{inbox:item.id});notice='Yêu cầu đã liên kết sang inbox harness; không cần nhập lại.';break;}
case 'history-filter':S.historyFilter=key;break;
case 'activity-filter':S.activityFilter=key;break;
case 'work-step':stepWork(a);break;
case 'work-pause':if(a&&!['completed','failed','cancelled'].includes(a.status)){a.desired='paused';a.status='pausing';workTimeline(a,'Ghi desired pause; đang chờ acknowledge, chặn admission mới.');syncRunAssignments(a);}break;
case 'work-resume':if(a?.status==='paused'&&online()){a.desired='running';a.status='queued';workTimeline(a,'Resume mô phỏng từ checkpoint qua admission.');syncRunAssignments(a);}break;
case 'work-cancel':if(a&&!['completed','failed','cancelled'].includes(a.status)){a.desired='cancelled';a.status='cancelling';workTimeline(a,'Ghi yêu cầu cancel; chưa khẳng định side effect đã thu hồi.');syncRunAssignments(a);}break;
case 'work-fail':if(a?.status==='evaluating'&&online()){evidenceFor(a,false);a.status='failed';workTimeline(a,'Kết quả thiếu điều kiện bắt buộc; không completed.');syncRunAssignments(a);addInbox('Phân tích kiểm chứng chưa đạt','request',a.id);audit('work',a.id+' thất bại có evidence','run/'+a.id);}break;
case 'work-retry':if(a?.status==='failed'&&online()){const next=submitAndStartRun(a.title+' · lượt thử mới',a.owner,a.kind);next.timeline.push({at:stamp(),text:'Liên kết lượt trước '+a.id+'; không sửa verdict cũ.'});nav('run/'+next.id);return;}break;
case 'inbox-filter':S.inboxFilter=key;break;
case 'inbox-process':if(i&&online()){i.status='working';let task=S.workflowRuns.find(a=>a.id===i.runId);if(!task){task=submitAndStartRun(i.title,'harness',i.kind==='capability'?'capability':'harness');i.runId=task.id;}nav('run/'+task.id);return;}break;
case 'decision-grant':if(i?.status==='decision'&&online()){mutatePermissions('Người dùng cấp write/test cho việc bị chặn',()=>{S.permissions.write=true;S.permissions.test=true;});i.reply='Người dùng cấp write/test trong worktree; publish giữ nguyên.';i.status='working';const task=S.workflowRuns.find(a=>a.id===i.runId);if(task?.status==='blocked'){task.status='queued';task.reason='';task.configRevision=S.config.revision;if(task.bundle)task.bundle.configRevision=S.config.revision;ensureWorker(task);workTimeline(task,'Đã ghi quyết định quyền tại checkpoint chưa dispatch, chuyển config r'+S.config.revision+' rồi quay lại admission.');}audit('decision','Ghi quyền cho '+i.id,'inbox/'+i.id);notice='Quyết định đã ghi. Công việc chưa tự completed.';}break;
case 'decision-keep':if(i?.status==='decision'){i.reply='Giữ phạm vi hiện tại; phần phụ thuộc tiếp tục bị chặn.';i.status='working';audit('decision',i.reply,'inbox/'+i.id);notice=i.reply;}break;
case 'config-group':S.config.group=key;break;
case 'config-preview':S.config.preview=true;validateConfig();break;
case 'config-reset':S.config.draft={};S.config.base=S.config.revision;S.config.errors=[];S.config.preview=false;notice='Đã hoàn tác nháp, không đổi active/history.';break;
case 'config-rebase':S.config.base=S.config.revision;S.config.errors=[];S.config.preview=false;notice='Đã nạp base revision hiện tại; giữ nháp để xem lại diff.';break;
case 'config-stale':S.config.revision++;audit('config','Mô phỏng một thay đổi từ chat, active r'+S.config.revision,'config');notice='Revision đã đổi từ nguồn khác. Nháp cần validate/review lại.';break;
case 'config-capability':S.config.capabilityMissing=!S.config.capabilityMissing;S.config.preview=true;validateConfig();break;
case 'config-activate':if(!online())break;S.config.preview=true;if(validateConfig().length)break;applyConfigChanges();break;
case 'config-sync':if(online()){S.config.observed=S.config.revision;S.lastReconcile=stamp();audit('sync','Observed config r'+S.config.observed,'config');notice='Đã sync config trong fixture. Không phải bằng chứng provider enforcement.';}break;
case 'config-restore':{if(!online())break;const h=S.config.history.find(h=>h.revision===+key);if(!h){notice='Không tìm thấy snapshot.';break;}S.config.history.unshift({revision:S.config.revision,active:{...S.config.active},overrides:JSON.parse(JSON.stringify(S.config.overrides||{})),permissions:{...S.permissions},note:'Snapshot trước restore'});S.config.active={...h.active};S.config.overrides=JSON.parse(JSON.stringify(h.overrides||{}));if(h.permissions)S.permissions={...h.permissions};if(h.workerLimit)S.workerLimit=h.workerLimit;if(h.minutesLimit)S.minutesLimit=h.minutesLimit;S.workerLimit=+S.config.active['limits:0'];S.minutesLimit=+S.config.active['limits:1'];S.config.revision++;S.config.base=S.config.revision;S.config.draft={};S.config.preview=false;S.config.errors=[];audit('config','Restore từ r'+key+' thành r'+S.config.revision,'config');notice='Đã tạo revision mới từ snapshot. Audit/run history được giữ.';break;}

function v1Occurrences(j){if(j.kind==='once')return [j.at.replace('T',' ')+' · '+j.zone];if(j.kind==='interval'){return [1,2,3].map(n=>'22/10/2026 '+String(Math.floor((540+j.every*n)/60)%24).padStart(2,'0')+':'+String((540+j.every*n)%60).padStart(2,'0')+' · '+j.zone);}const parts=j.cron.trim().split(/\s+/);if(parts.length===5&&parts.slice(2).every(x=>x==='*')){if(/^\*\/\d+$/.test(parts[0])&&parts[1]==='*'){const step=+parts[0].slice(2);if(step>0&&step<60)return [1,2,3].map(n=>'22/10/2026 '+String(9+Math.floor(step*n/60)).padStart(2,'0')+':'+String(step*n%60).padStart(2,'0')+' · '+j.zone);}if(/^\d+$/.test(parts[0])&&/^\d+$/.test(parts[1]))return [23,24,25].map(day=>day+'/10/2026 '+parts[1].padStart(2,'0')+':'+parts[0].padStart(2,'0')+' · '+j.zone);}return ['Chưa mô phỏng occurrence cho biểu thức này; tích hợp thật phải dùng scheduler parser.'];}

 {id:'plan',depth:0,pattern:'Chaining',name:'Khảo sát → lập kế hoạch',status:'completed',attempt:1,iteration:1},

 {id:'worker2',depth:1,pattern:'Nested workflow / chain',name:'Reviewer · test → review',status:'running',attempt:1,iteration:1},
 {id:'test',depth:2,pattern:'Nested / chaining',name:'Chạy test trong nhánh review',status:'running',attempt:1,iteration:1},

 ];if(a.status==='completed')for(const step of v.runSteps[a.id])step.status='completed';else if(['failed','cancelled'].includes(a.status))for(const step of v.runSteps[a.id])if(step.status!=='completed')step.status=a.status; }return v.runSteps[a.id];}

function v1ReleaseControls(r){let b='';if(['candidate','rejected'].includes(r.state))b=button('Kiểm theo plan đạt (fixture)','v1-release-check')+button('Kiểm bắt buộc thất bại','v1-release-reject');if(['validated','awaiting-decision'].includes(r.state))b=button(r.state==='awaiting-decision'?'Cho phép activation lần này':'Bắt đầu activation','v1-release-start','','primary');if(r.state==='draining')b=button('Checkpoint phạm vi bị ảnh hưởng','v1-release-checkpoint')+button('Chưa checkpoint được → hoãn','v1-release-defer');if(r.state==='prepared')b=button(r.backupRequired?'Backup xác minh đọc được + migration + reload':'Reload · không backup toàn bộ','v1-release-reload','','primary')+(r.backupRequired?button('Backup thất bại','v1-release-backup-fail'):'');if(r.state==='reloaded')b=button('Kiểm bắt buộc sau activation đạt','v1-release-health','','primary')+button('Lỗi chức năng đã khoanh vùng','v1-release-health-fail')+button('Lỗi chưa khoanh vùng','v1-release-unknown-fail')+button('Plugin không boot / không tự sửa được','v1-release-boot-fail');if(r.state==='retained')b=button('Phát hiện lỗi muộn (nghi vấn)','v1-release-health-fail');if(r.state==='needs-fix')b=button(r.fixApprovalRevision===S.config.revision?'Cho phép activation bản sửa lần này':'Bản sửa liên quan + kiểm đạt (fixture)','v1-release-fix','','primary')+button('Mất khả năng tự sửa → recovery','v1-release-boot-fail');if(['deferred','blocked'].includes(r.state))b=button('Đọc lại phạm vi / kiểm lại candidate','v1-release-recheck');return '<div class="actions">'+b+'</div>';}
function v1RecoveryView(){const r=S.v1.releaseOperation;if(!r||!['recovering','recovery-failed','restored'].includes(r.state))return releaseRolesView()+recoveryView();return releaseRolesView()+'<section class="recovery-companion"><div class="eyebrow">RL03 · executable độc lập · fixture</div><h1>Recovery ngoài plugin lỗi</h1><p>Plugin '+esc(S.plugin)+'. Màn minh họa này không phải UI của plugin bị lỗi vẫn đang chạy.</p><p>Bản phục hồi dự kiến: '+esc(r.base)+' · '+esc(r.state)+'</p><div class="grid">'+panel('Code và dữ liệu','<p>Backup '+esc(r.backup)+' · '+esc(r.migration)+'</p><p>Chỉ phục hồi code khi đọc được dữ liệu hiện tại. Không tự restore snapshot cũ để xóa công việc mới.</p><p>Tương thích: '+(S.compatible?'đã kiểm trong fixture':'chưa có đường phục hồi tương thích')+'</p>')+panel('Đối soát','<p>'+r.checkpoints.length+' work có checkpoint; giữ WorkRefs và agent identities.</p><p>Executable bảo vệ activation không bị thay trong operation hiện tại.</p>')+'</div><ol class="timeline">'+r.log.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="actions">'+(['recovering','recovery-failed'].includes(r.state)?button('Phục hồi code tương thích, giữ dữ liệu','v1-release-restore','','primary')+button('Recovery lỗi','v1-release-restore-fail')+button(S.compatible?'Mô phỏng schema không tương thích':'Mô phỏng đã có đường phục hồi tương thích','recovery-compat'):'')+(r.state==='restored'?link('Xem kết quả release','releases')+link('Work đã nhận lại','work-items'):'')+'</div></section>';}
function v1NewEvidence(title,summary,runId=''){const ev={id:id('v1-evidence'),title,summary,runId,ref:'fixture:v1',configRevision:S.config.revision,criteriaRevision:'criteria-shop-1',details:summary,source:'fixture:v1',revision:activeReleaseVersion(),outcome:'accepted',at:stamp(),digest:'fixture-only'};S.evidence.unshift(ev);return ev.id;}
function v1RunSchedule(j,reason='manual'){
 const v=S.v1;if(!S.host){notice='Host offline: không chạy; missed policy được xử lý sau khi host trở lại.';return;}if(v1AdmissionBlocked(j.executor==='agent'?'harness':'project')){notice='Phạm vi đang tạm dừng; giữ lượt chờ, chưa dispatch.';j.pending=Math.min(j.pending+1,j.cap);return;}
 const log=(status,why,work='')=>{const r={id:'job-run-'+(++v.runSerial),status,reason:why,work,at:stamp()};j.history.unshift(r);return r;};
 if(j.running&&(j.overlap==='skip'||j.overlap==='queueOne'||j.running>=j.cap)){if(j.overlap==='queueOne')j.pending=1;log('skipped',j.overlap==='queueOne'?'Đã giữ một lượt chờ':'Không nhận thêm lượt theo overlap policy');return;}
 const r=log('running',reason);j.running++;
 if(j.executor==='code'){r.reason+=' · handler đang chạy bằng code, chưa gọi agent';}
 else{const owner=j.executor==='agent'?'harness':'project';const a=submitAndStartRun('Theo lịch: '+j.name,owner,'scheduled','schedule',r.id,j.executor==='agent'?bundleForDefinition(j.target):null);r.runId=a.id;if(a.status==='blocked'){r.status='blocked';j.running--;r.reason=a.reason||'Thiếu quyền/capability; không dispatch.';}}
 if(j.kind==='once'&&reason==='manual')j.paused=true;
 audit('schedule','Lượt '+r.id+' '+r.status,'schedules/'+j.id);
}
function v1Action(action,key){v1Ensure();const v=S.v1,j=v.schedules.find(x=>x.id===key),r=v.releaseOperation;
 const local=/^v1-(view|analytics|trial|schedule-(new|edit|close))/.test(action);
 if(!local&&!S.host){notice='Host offline: thao tác chưa thực hiện, giữ dữ liệu fixture.';render();return;}
 switch(action){
 case 'v1-analytics-seed':v1SeedTelemetry();v.analytics.empty=false;break;
 case 'v1-analytics-missing':v.analytics.missing=!v.analytics.missing;break;
 case 'v1-analytics-empty':v.analytics.empty=!v.analytics.empty;break;
 case 'v1-view-save':{const f=document.querySelector('[data-form=v1-analytics]');if(f)v1ReadAnalytics(new FormData(f));if(!v.analytics.name.trim()){notice='Nhập tên view.';break;}let saved=v.views.find(x=>x.name===v.analytics.name);if(saved)saved.filters={...v.analytics};else v.views.push({id:id('view'),name:v.analytics.name,filters:{...v.analytics}});notice='Đã lưu view trong fixture cục bộ.';break;}
 case 'v1-view-load':{const view=v.views.find(x=>x.id===key);if(view)v.analytics={...view.filters};break;}
 case 'v1-view-delete':v.views=v.views.filter(x=>x.id!==key);break;
 case 'v1-trial':v.controlledTrial=v1NewEvidence('Controlled trial fixture','Cùng suite/cases/criteria/environment; baseline và candidate đều đạt 4/4. Số liệu mô phỏng.');break;
 case 'v1-schedule-new':v.scheduleDraft=v1ScheduleTemplate();nav('schedules/new');return;
 case 'v1-schedule-edit':v.scheduleDraft=JSON.parse(JSON.stringify(j));nav('schedules');return;

 case 'v1-schedule-toggle':if(j){j.paused=!j.paused;j.revision++;audit('schedule','Lịch '+j.name+(j.paused?' paused':' enabled'),'schedules/'+j.id);}break;
 case 'v1-schedule-run':if(j)v1RunSchedule(j);break;
 case 'v1-schedule-missed':if(j){const count=j.missed==='skip'?0:j.missed==='latest'?1:Math.min(4,j.cap);j.history.unshift({id:'missed-'+(++v.runSerial),status:count?'coalesced':'skipped',reason:'Bỏ lỡ 4 lượt; nhận '+count+' theo '+j.missed,at:stamp()});j.pending=Math.min(j.pending+count,j.cap);}break;
 case 'v1-schedule-finish':if(j){const item=j.history.find(x=>x.status==='running');if(item){item.status='completed';item.reason+=' · hoàn tất fixture, outcome code unchanged hoặc bàn giao work riêng';j.running=Math.max(0,j.running-1);item.evidence=v1NewEvidence('Kết quả Job '+item.id,'Kết quả fixture. Agent turn kết thúc chưa đồng nghĩa work đạt.',item.runId);}if(j.pending){j.pending--;v1RunSchedule(j,'queued');}}break;
 case 'v1-handler-request':{const item=addInbox('Tạo Job kiểm dependency có bản vá');v.handlerRequest={id:'dependency.check@1',request:'Mỗi sáng kiểm dependency có bản vá; chỉ gửi inbox khi có thay đổi.',state:'requested',inbox:item.id};message('harness','user',v.handlerRequest.request,{inbox:item.id});notice='Đã gửi yêu cầu qua chat harness; candidate chưa đăng ký.';break;}
 case 'v1-handler-pass':if(v.handlerRequest){v.handlerRequest.state='registered';if(!v.handlers.some(x=>x.id===v.handlerRequest.id))v.handlers.push({id:v.handlerRequest.id,name:'Kiểm bản vá dependency'});message('harness','agent','Candidate handler '+v.handlerRequest.id+' đã qua kiểm trong fixture và được đăng ký. Bạn có thể chọn nó khi tạo lịch.',{inbox:v.handlerRequest.inbox});audit('job-handler','Kiểm đạt fixture, đăng ký '+v.handlerRequest.id,'schedules');}break;
 case 'v1-handler-fail':if(v.handlerRequest)v.handlerRequest.state='failed';break;
 case 'v1-handler-use':if(v.handlerRequest?.state==='registered'){v.scheduleDraft={...v1ScheduleTemplate(),name:'Kiểm bản vá mỗi sáng',target:v.handlerRequest.id,kind:'cron',cron:'0 9 * * *'};nav('schedules/new');return;}break;
 case 'v1-source-error':{const x=v.integrations.find(x=>x.id===key);if(x){x.status='blocked';x.error='Fixture: quyền đọc nguồn bị từ chối. Cursor giữ nguyên; không nhận delta hoặc tự đổi quyền.';}break;}
 case 'v1-source-recover':{const x=v.integrations.find(x=>x.id===key);if(x){x.status='ready';x.error='';}break;}
 case 'v1-source-empty':{const x=v.integrations.find(x=>x.id===key);notice=x?.status==='ready'?'Poll unchanged (fixture): không tạo work hoặc agent.':'Nguồn chưa sẵn sàng; chưa poll hoặc đổi cursor.';break;}
 case 'v1-source-delta':{const x=v.integrations.find(x=>x.id===key);if(!x||x.status!=='ready'){notice='Nguồn chưa sẵn sàng; không đổi cursor hoặc dispatch.';break;}if(x.events.length){notice='Delta cùng source revision: giữ nguyên inbox/Run, không tạo trùng.';break;}if(v1AdmissionBlocked('project')){notice='Luồng dự án tạm dừng: chưa dispatch.';break;}const source=key==='gitlab'?'GitLab !42 comment #831':'Backlog SHOP-241',item=addInbox('Tín hiệu nguồn: '+source),a=submitAndStartRun('Xử lý '+source,'project','integration','poll',source);const ev=v1NewEvidence('Nguồn '+source,'Payload revision fixture và correlation tới inbox/Run.',a.id);a.evidence.push(ev);item.runId=a.id;item.status='working';x.cursor=key==='gitlab'?'comment:831':'revision:241';x.events.unshift({source,event:source,state:'delivered',runId:a.id,inbox:item.id,evidence:ev});break;}
 case 'v1-step-add':{const a=S.workflowRuns.find(a=>a.id===key);if(!a||a.status!=='running'||v1AdmissionBlocked(a.owner,a.id))break;const tree=v1Tree(a),workers=tree.filter(x=>x.id.startsWith('worker'));if(workers.length>=4){notice='Đã có 4 units fixture; không thêm unit.';break;}if(tree.find(x=>x.id==='optimize').status!=='waiting'){notice='Kế hoạch đã vào vòng đánh giá; không thêm unit vào join đã đóng.';break;}const running=workers.filter(x=>x.status==='running').length;tree.splice(tree.findIndex(x=>x.id==='optimize'),0,{id:'worker'+(workers.length+1),depth:1,pattern:'Orchestrator-workers',name:'Unit được chia động '+(workers.length+1),status:running<S.workerLimit?'running':'waiting',attempt:1,iteration:1});break;}
 case 'v1-step-pass':case 'v1-step-fail':case 'v1-step-retry':case 'v1-step-revise':{const [runId,step]=key.split('|'),a=S.workflowRuns.find(a=>a.id===runId);if(!a)break;const tree=v1Tree(a),node=tree.find(n=>n.id===step);if(!node)break;if(a.status!=='running'){notice='Run chưa chạy hoặc đang dừng; không thực hiện bước mới.';break;}if(v1AdmissionBlocked(a.owner,a.id)){notice='Phạm vi này đang giữ checkpoint; chưa chạy bước mới.';break;}if(['parallel','worker2'].includes(node.id)){notice='Bước cha chờ các bước con đạt; không bỏ qua join.';break;}if(action==='v1-step-retry'&&node.status==='failed'){if(node.attempt>=3){notice='Hết trần retry; giữ evidence và cần quyết định.';break;}node.attempt++;node.status='running';}else if(action==='v1-step-revise'&&node.status==='running'){if(node.iteration>=3){node.status='failed';node.feedback='Hết 3 vòng chất lượng; chưa đạt.';}else{node.iteration++;node.feedback='Evaluator: cần bổ sung test hồi quy; vòng sửa tiếp theo.';}}else if(node.status==='running'){node.status=action==='v1-step-pass'?'completed':'failed';if(node.status==='failed')node.feedback='Fixture: kiểm bước chưa đạt; không completed Run.';if(node.id==='test'&&node.status==='completed')tree.find(x=>x.id==='review').status='running';if(node.id==='review'&&node.status==='completed')tree.find(x=>x.id==='worker2').status='completed';const workers=tree.filter(x=>x.id.startsWith('worker'));const available=S.workerLimit-workers.filter(x=>x.status==='running').length;for(const next of workers.filter(x=>x.id!=='worker2'&&x.status==='waiting').slice(0,Math.max(0,available)))next.status='running';if(workers.every(x=>x.status==='completed')){tree.find(x=>x.id==='parallel').status='completed';if(tree.find(x=>x.id==='optimize').status==='waiting')tree.find(x=>x.id==='optimize').status='running';}if(node.id==='optimize'&&node.status==='completed'){const ev=v1NewEvidence('Evaluator fixture đạt','Bằng chứng vòng đánh giá; verdict toàn Run vẫn qua điều kiện bắt buộc.',work);a.evidence.push(ev);}}break;}
 case 'v1-release-create':{if(v1ReleaseBusy()||r&&['candidate','validated','awaiting-decision','blocked','deferred'].includes(r.state)){notice='Đang có candidate/activation chưa xử lý; chưa activation cải tiến khác.';break;}const scope=document.querySelector('[name=release-scope]')?.value||'ui',impact=document.querySelector('[name=release-impact]')?.value||'none';v.releaseSerial++;const deep=['runtime','schema','jobs','all'].includes(scope),backupRequired=['schema','all'].includes(scope);v.releaseOperation={name:'Candidate cập nhật plugin',operationId:id('activation'),version:'0.2.'+v.releaseSerial,baselineReleaseRef:S.activeReleaseRef,base:activeReleaseVersion(),state:'candidate',policyRevision:S.config.revision,scope,impact,path:deep?'Deep path':'Fast path',changes:v1ReleaseChanges(scope),backupRequired,plan:deep?'Kiểm sâu theo phần bị ảnh hưởng; schema kiểm compatibility, scheduler kiểm replay/overlap, runtime kiểm resume/recovery.':'Kiểm nạp/build và hành vi trực tiếp liên quan; không diễn tập recovery toàn bộ.',check:'chưa kiểm',backup:backupRequired?'bắt buộc trước migration khó đảo ngược':'không bắt buộc cho thay đổi này',migration:backupRequired?'chưa thực hiện':'không cần',health:'chưa kiểm',resume:impact==='none'?'không cần':'chưa kiểm',recovery:'chưa xác minh',checkpoints:[],log:['Candidate chưa activation; đường kiểm do policy fixture chọn.']};v.releaseOperation.targetReleaseRef=prototypeModel().selectActivation(v.releaseOperation.version).id;break;}
 case 'v1-release-check':if(r&&['candidate','rejected'].includes(r.state)){if(!S.compatible){r.state='rejected';r.check='failed';r.log.push('Chưa chứng minh recovery tương thích; không activation.');break;}r.state='validated';r.check='passed (fixture)';r.recovery='artifact và executable sẵn dùng (fixture)';r.policyRevision=S.config.revision;r.evidence=v1NewEvidence('Check plan '+r.version,r.path+' · '+r.plan);r.log.push('Kiểm trước activation đạt; evidence gắn đúng candidate.');}break;
 case 'v1-release-reject':if(r&&['candidate','rejected'].includes(r.state)){r.state='rejected';r.check='failed';r.log.push('Kiểm bắt buộc không đạt/chưa xong: chưa activation.');}break;
 case 'v1-release-start':if(r&&['validated','awaiting-decision'].includes(r.state)){const policy=S.config.active['actions:4'];if(S.improvements.some(i=>i.status==='needs-fix')){notice='Cải tiến khác đang activation hoặc cần sửa; chưa bắt đầu plugin activation.';break;}if(activeReleaseVersion()!==r.base||r.policyRevision!==S.config.revision){r.state='blocked';r.log.push('Baseline/policy đổi; cần kiểm lại.');break;}if(policy==='deny'){r.state='blocked';r.log.push('Activation bị deny.');break;}if(policy==='ask'&&r.state!=='awaiting-decision'){r.state='awaiting-decision';r.log.push('Chờ quyết định một lần; không đổi policy ask.');break;}if(r.impact==='unknown'){r.state='deferred';r.log.push('Chưa rõ ảnh hưởng: hoãn trước activation; cập nhật kịch bản rồi kiểm lại.');break;}v1SetReleaseGate(r);r.state=r.impact==='none'?'prepared':'draining';r.log.push(r.impact==='none'?'Không ảnh hưởng Run hiện tại: không dừng admission hoặc chờ toàn bộ checkpoint.':'Chỉ dừng admission trong phạm vi '+r.impact+' và chờ checkpoint.');}break;
